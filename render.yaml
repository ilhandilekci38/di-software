services:
  - type: web
    name: di-software-27
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 4 --timeout 300 app:app
    healthCheckPath: /health
    autoDeploy: true
